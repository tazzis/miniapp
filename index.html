<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Моя мини-апп</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="version"></div>

    <div id="main" class="screen active">
      <h1 id="greeting">Привет!</h1>
      <button id="toProfile">Мой профиль</button>
      <p>Нажатий: <span id="count">0</span></p>
      <button id="clickBtn">+1</button>
      <button id="counterReset">Reset</button>
    </div>

    <div id="profile" class="screen">
      <img id="avatar" alt="Аватар" />
      <h2 id="name"></h2>
      <p id="username"></p>
      <p id="userId"></p>
      <button id="toMain">Назад</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
