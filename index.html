<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Моя мини-апп</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #version {
        position: fixed;
        top: 4px;
        right: 8px;
        font-size: 11px;
        opacity: 0.5;
      }

      body {
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        background: var(--tg-theme-bg-color);
        color: var(--tg-theme-text-color);
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      #avatar {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
      }

      button {
        background: var(--tg-theme-button-color);
        color: var(--tg-theme-button-text-color);
        border: none;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 16px;
        margin: 6px;
        cursor: pointer;
      }

      #profile {
        background: var(--tg-theme-secondary-bg-color);
        border-radius: 16px;
        padding: 24px;
        margin-top: 20px;
      }

      #avatar {
        border: 3px solid var(--tg-theme-button-color);
      }
    </style>
  </head>

  <body>
    <div id="main" class="screen active">
      <h1 id="greeting">Привет!</h1>
      <button id="toProfile">Мой профиль</button>
      <p>Нажатий: <span id="count">0</span></p>
      <button id="clickBtn">+1</button>
      <button id="counterReset">Reset</button>
    </div>

    <div id="profile" class="screen">
      <img id="avatar" alt="Аватар" />
      <h2 id="name"></h2>
      <p id="username"></p>
      <p id="userId"></p>
      <button id="toMain">Назад</button>
    </div>

    <script>
      const APP_VERSION = "0.1.0";
      document.getElementById("version").textContent = "v" + APP_VERSION;

      fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (response) {
          return response.text();
        })
        .then(function (text) {
          const match = text.match(/APP_VERSION = "(\d[^"]*)"/);
          if (
            match &&
            match[1] !== APP_VERSION &&
            location.search !== "?v=" + match[1]
          ) {
            location.replace(
              location.pathname + "?v=" + match[1] + location.hash
            );
          }
        })
        .catch(function () {});

      const tg = window.Telegram.WebApp;
      tg.ready();

      tg.MainButton.setText("+1");
      tg.MainButton.show();

      const user = tg.initDataUnsafe.user;

      if (user) {
        document.getElementById("greeting").textContent =
          "Привет, " + user.first_name + "!";
        document.getElementById("name").textContent =
          user.first_name + " " + (user.last_name || "");
        document.getElementById("username").textContent = user.username
          ? "@" + user.username
          : "";
        if (user.photo_url) {
          document.getElementById("avatar").src = user.photo_url;
        }
        document.getElementById("userId").textContent =
          "Your telegram ID is: " + user.id;
      }

      function showScreen(id) {
        document.getElementById("main").classList.remove("active");
        document.getElementById("profile").classList.remove("active");
        document.getElementById(id).classList.add("active");
      }

      document.getElementById("toProfile").onclick = function () {
        showScreen("profile");
      };
      document.getElementById("toMain").onclick = function () {
        showScreen("main");
      };

      let count = 0;
      const countEl = document.getElementById("count");

      tg.CloudStorage.getItem("count", function (error, value) {
        <!--
        tg.showAlert(
          "версия: " +
            tg.version +
            "\nошибка: " +
            error +
            "\nзначение: " +
            value
        );
        -->
        if (!error && value) {
          count = Number(value);
          countEl.textContent = count;
        }
      });

      function addClick() {
        count++;
        countEl.textContent = count;
        tg.CloudStorage.setItem("count", String(count));
      }

      document.getElementById("clickBtn").onclick = addClick;
      tg.MainButton.onClick(addClick);

      document.getElementById("counterReset").onclick = function () {
        count = 0;
        countEl.textContent = count;
        tg.CloudStorage.removeItem("count");
      };
    </script>
  </body>
  <div id="version"></div>
</html>
